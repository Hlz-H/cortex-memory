<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cortex - AI Memory</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="stylesheet" href="/css/cortex.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
</head>
<body class="bg-dark text-light min-h-screen flex">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <svg class="logo" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-5.5-2.5l7.51-3.22-7.52-3.22 3.22 7.52-3.21-1.08z"/></svg>
      <h1>Cortex</h1>
    </div>
    <nav class="nav-links">
      <a href="/dashboard" hx-get="/ui/dashboard" hx-target="#main-content" hx-push-url="/dashboard" class="nav-link active">
        <span class="icon">📊</span> Dashboard
      </a>
      <a href="/memories" hx-get="/ui/memories" hx-target="#main-content" hx-push-url="/memories" class="nav-link">
        <span class="icon">🧠</span> Memories
      </a>
      <a href="/tags" hx-get="/ui/tags" hx-target="#main-content" hx-push-url="/tags" class="nav-link">
        <span class="icon">🏷️</span> Tags
      </a>
      <a href="/graph" hx-get="/ui/graph" hx-target="#main-content" hx-push-url="/graph" class="nav-link">
        <span class="icon">🔗</span> Graph
      </a>
      <a href="/agents" hx-get="/ui/agents" hx-target="#main-content" hx-push-url="/agents" class="nav-link">
        <span class="icon">🤖</span> Agents
      </a>
      <a href="/config" hx-get="/ui/config" hx-target="#main-content" hx-push-url="/config" class="nav-link">
        <span class="icon">⚙️</span> Settings
      </a>
    </nav>
    <div class="sidebar-footer">
      <small>v0.1.0</small>
    </div>
  </aside>

  <!-- Main Content -->
  <main id="main-content" class="main-content" hx-get="/ui/dashboard" hx-trigger="load">
    <!-- Initial load -->
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/js/cortex.js"></script>
</body>
</html>
